name: Release

# Pushing a version tag (e.g. 2026-10-30-v11) runs the full test suite, builds the
# Feishu and local editions plus the director-retro companion, and publishes a
# GitHub Release with the ZIPs and SHA256 files attached. Release notes are a fixed
# short line; the detailed record stays in maintenance/CHANGELOG.md.

on:
  push:
    tags:
      - "20*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies (Pillow, numpy, FFmpeg)
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Test director skill
        run: python -B -m unittest discover -s scripts -p "test_*.py"

      - name: Test director-retro companion
        working-directory: companion-skills/director-retro
        run: python -B -m unittest discover -s scripts -p "test_*.py"

      - name: Test cover-performance tools
        working-directory: capabilities/cover-performance/scripts
        run: python -B -m unittest discover -s . -p "test_*.py"

      - name: Test reference-rule-extraction tools
        working-directory: capabilities/reference-rule-extraction/scripts
        run: python -B -m unittest discover -s . -p "test_*.py"

      - name: Build editions
        env:
          TAG: ${{ github.ref_name }}
        run: python -B scripts/build_editions.py --output-dir "$RUNNER_TEMP/dist" --version "$TAG"

      - name: Test built packages
        run: |
          cd "$RUNNER_TEMP/dist"
          for z in director-seedance-prompt-*-feishu.zip director-seedance-prompt-*-local.zip; do
            d="pkg-${z%.zip}"
            mkdir "$d" && unzip -q "$z" -d "$d"
            (cd "$d/director-seedance-prompt" && python -B -m unittest discover -s scripts -p "test_*.py")
          done
          rm -rf pkg-*

      - name: Package director-retro
        env:
          TAG: ${{ github.ref_name }}
        working-directory: companion-skills
        run: |
          python - <<'PY'
          import hashlib, os, zipfile
          tag = os.environ["TAG"]
          name = f"director-retro-{tag}.zip"
          out = os.path.join(os.environ["RUNNER_TEMP"], "dist", name)
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for root, dirs, files in os.walk("director-retro"):
                  dirs[:] = sorted(d for d in dirs if d != "__pycache__")
                  for file in sorted(files):
                      path = os.path.join(root, file)
                      info = zipfile.ZipInfo(path.replace(os.sep, "/"), date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      with open(path, "rb") as handle:
                          archive.writestr(info, handle.read())
          digest = hashlib.sha256(open(out, "rb").read()).hexdigest()
          with open(out + ".sha256", "w", encoding="utf-8") as handle:
              handle.write(f"{digest}  {name}\n")
          PY

      - name: Release notes
        run: |
          {
            echo "本次更新："
            echo "- 解决了一些已知问题。"
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/*.zip "$RUNNER_TEMP"/dist/*.sha256 --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/dist/*.zip "$RUNNER_TEMP"/dist/*.sha256 \
              --title "director-seedance-prompt $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
